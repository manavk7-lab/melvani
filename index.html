<!doctype html>
<html lang="gu">
<head>
<!--HEAD-ONLY-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2B3F8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Melvani">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!--/HEAD-ONLY-->
<title>Melvani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Serif+Gujarati:wght@400;600&display=swap">
<style>
:root{
  --paper:#F5F6F9; --surface:#FFFFFF; --ink:#1B2130; --ink-2:#4E566A; --ink-3:#7A8296;
  --rule:#DDE1EA; --accent:#2B3F8F; --accent-ink:#FFFFFF; --accent-soft:#E7EBF7;
  --rose:#C2417A; --rose-soft:#FBE9F1; --ok:#1E7A54; --warn:#9A5B00; --warn-soft:#FDF1DD; --err:#B3261E;
  --table:#262B36; --table-2:#343A47; --table-ink:#E9ECF3;
  --shadow:0 1px 2px rgba(18,26,48,.08),0 10px 30px rgba(18,26,48,.12);
  --ui:'Hind Vadodara',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sans-gu:'Noto Sans Gujarati','Hind Vadodara','Gujarati Sangam MN','Shruti',sans-serif;
  --serif-gu:'Noto Serif Gujarati','Gujarati MT','Noto Sans Gujarati',serif;
  --text-font:var(--sans-gu); --fs:20px;
  --split-x:50%; --split-y:42%;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11141B; --surface:#181C25; --ink:#E6E8EF; --ink-2:#AEB4C4; --ink-3:#7E859A;
    --rule:#2A303C; --accent:#96A8F3; --accent-ink:#0E1220; --accent-soft:#222A44;
    --rose:#F07FAE; --rose-soft:#3A2331; --ok:#5FCB9C; --warn:#F0B25A; --warn-soft:#3A2D16; --err:#FF8A80;
    --table:#0B0D12; --table-2:#1B1F28; --table-ink:#E6E8EF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11141B; --surface:#181C25; --ink:#E6E8EF; --ink-2:#AEB4C4; --ink-3:#7E859A;
  --rule:#2A303C; --accent:#96A8F3; --accent-ink:#0E1220; --accent-soft:#222A44;
  --rose:#F07FAE; --rose-soft:#3A2331; --ok:#5FCB9C; --warn:#F0B25A; --warn-soft:#3A2D16; --err:#FF8A80;
  --table:#0B0D12; --table-2:#1B1F28; --table-ink:#E6E8EF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:15px/1.45 var(--ui);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
/* header */
.bar{display:flex;align-items:center;gap:6px;padding:6px 16px;min-height:54px;background:var(--surface);border-bottom:1px solid var(--rule);position:relative;z-index:5}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.ib:hover{background:var(--accent-soft);color:var(--ink)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.book{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;line-height:1.2}
.book b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync[data-s="saving"]::before{background:var(--warn)}
.sync[data-s="error"]::before{background:var(--err)}
.sync[data-s="demo"]::before{background:var(--rose)}
.pager{display:flex;align-items:center;gap:2px;flex:none}
.pagechip{display:flex;align-items:baseline;gap:4px;min-width:64px;justify-content:center;height:40px;padding:0 10px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);cursor:pointer;font-variant-numeric:tabular-nums}
.pagechip .pn{font-weight:600;font-size:17px}
.pagechip .of{font-size:12px;color:var(--ink-3)}
.pagechip.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--rule));}
.pagechip.done .pn::after{content:" ✓";color:var(--ok);font-size:14px}
.actions{display:flex;align-items:center;gap:4px;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{height:32px;padding:0 10px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--rule))}
.btn:disabled{opacity:.5;cursor:default}
.hide-narrow{}
@media (max-width:640px){
  .bar{padding:6px 10px;gap:3px}
  .ib{width:38px;height:38px}
  .book,.hide-narrow{display:none}
  .pager{flex:1;justify-content:center}
  .btn .lbl{display:none}
  .btn#btnDone{padding:0 11px}
}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;font-size:14px;border-bottom:1px solid var(--rule);background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft)}
.banner.demo{background:var(--rose-soft)}
.banner .bmsg{flex:1 1 260px}

/* split layout: stacked by default (phone / portrait) */
.split{display:grid;min-height:0;grid-template-rows:var(--split-y) 12px minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
@media (orientation:landscape) and (min-width:720px){
  .split{grid-template-rows:minmax(0,1fr);grid-template-columns:var(--split-x) 10px minmax(0,1fr)}
}
.split.swap .scan{order:3}.split.swap .divider{order:2}.split.swap .textpane{order:1}

/* scan pane — a light table */
.scan{position:relative;min-height:0;min-width:0;background:var(--table);color:var(--table-ink);overflow:hidden}
.scan-view{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.scan-view:active{cursor:grabbing}
.scan-view img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;will-change:transform;-webkit-user-drag:none;pointer-events:none;box-shadow:0 2px 18px rgba(0,0,0,.45)}
.scan-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:15px;color:var(--table-ink);opacity:.85;pointer-events:none}
.scan-msg:empty{display:none}
.ruler{position:absolute;left:0;right:0;height:46px;box-shadow:0 0 0 100vmax rgba(8,10,16,.38);border-top:2px solid var(--rose);border-bottom:2px solid var(--rose);cursor:ns-resize;touch-action:none;z-index:2}
.ruler .grip{position:absolute;right:10px;bottom:-11px;width:34px;height:20px;border-radius:10px;background:var(--rose);display:grid;place-items:center;cursor:ns-resize}
.ruler .grip::before{content:"";width:14px;height:2px;background:#fff;box-shadow:0 4px 0 #fff}
.scan-tools{position:absolute;right:10px;bottom:10px;display:flex;gap:2px;padding:3px;border-radius:12px;background:color-mix(in srgb,var(--table-2) 88%,transparent);backdrop-filter:blur(6px);z-index:3}
.scan-tools .ib{color:var(--table-ink);width:38px;height:38px}
.scan-tools .ib:hover,.scan-tools .ib[aria-pressed="true"]{background:rgba(255,255,255,.14);color:#fff}
.fname{position:absolute;left:12px;bottom:14px;max-width:calc(100% - 240px);font-size:12px;color:var(--table-ink);opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;pointer-events:none}
.follow{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-size:13px;z-index:4;white-space:nowrap}

.divider{background:var(--rule);cursor:row-resize;position:relative;touch-action:none}
.divider::after{content:"";position:absolute;left:50%;top:50%;width:36px;height:4px;border-radius:2px;background:var(--ink-3);transform:translate(-50%,-50%)}
@media (orientation:landscape) and (min-width:720px){
  .divider{cursor:col-resize}
  .divider::after{width:4px;height:36px}
}

/* text pane */
.textpane{position:relative;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);-webkit-overflow-scrolling:touch}
.text{max-width:40em;margin:0 auto;padding:18px 18px 40vh 50px;font-family:var(--text-font);font-size:var(--fs);line-height:1.8;color:var(--ink)}
@media (max-width:640px){.text{padding:14px 16px 45vh 40px}}
.text p{position:relative;margin:0 0 .55em;padding:2px 6px;border-radius:6px;text-indent:1.4em;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text;transition:background-color .15s}
.text p.empty{min-height:.8em}
.text p.h1,.text p.h2,.text p.title{text-indent:0;font-weight:600;font-size:1.15em}
.text p.h3,.text p.h4{text-indent:0;font-weight:600}
.text p.bullet{text-indent:0;padding-left:1.4em}
.text p.bullet::before{content:"•";position:absolute;left:.4em}
.text p.cur{background:var(--accent-soft)}
.text p.locked{cursor:default;opacity:.8}
.text p.fixed::after{content:"";position:absolute;left:-12px;top:.8em;width:7px;height:7px;border-radius:50%;background:var(--rose)}
.text p.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--rose-soft)}100%{background:transparent}}
.vref{font-family:var(--ui);font-size:.8em;font-weight:600;color:var(--accent);padding:0 .3em;border-radius:4px;background:var(--accent-soft);font-variant-numeric:tabular-nums;text-indent:0}
.pmark{position:absolute;left:-44px;top:.35em;text-indent:0;font:600 11px/1.5 var(--ui);color:var(--rose);border:1px solid var(--rose);border-radius:4px;padding:0 4px;background:var(--surface);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:640px){.pmark{left:-36px}}
.pmark.here{background:var(--rose);color:#fff}
.hint{position:sticky;top:8px;z-index:3;margin:8px auto 0;width:fit-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;color:var(--ink-2)}

/* editing */
.editbox{margin:0 0 .6em;display:flex;flex-direction:column;gap:8px}
.edit-ta{width:100%;display:block;resize:none;overflow:hidden;font:inherit;line-height:1.8;color:var(--ink);background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:4px 8px;text-indent:0}
.editbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--ui);font-size:15px}
.editbar .spacer{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px 0;font-family:var(--text-font)}
.chips:empty{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-size:17px}
.chip.top{border-color:var(--accent);background:var(--accent-soft)}
.gu-toggle{font-family:var(--sans-gu);font-weight:600}
.edit-msg{font-family:var(--ui);font-size:13px;color:var(--err)}
.edit-msg.note{color:var(--ink-3)}
.edit-msg:empty{display:none}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,13,22,.42);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,90vw);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.drawer header h2{flex:1;margin:0;font-size:16px;font-weight:600;text-wrap:balance}
.prog{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.prog .track{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.prog .fill{height:100%;background:var(--ok)}
.plist{flex:1;overflow-y:auto;padding:6px 8px}
.prow{display:grid;grid-template-columns:34px 52px 1fr auto;align-items:center;gap:6px;min-height:42px;padding:0 8px;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
.prow:hover{background:var(--paper)}
.prow.on{background:var(--accent-soft)}
.prow .lab{font-weight:600}
.prow .nm{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .st{display:flex;gap:6px;color:var(--ink-3)}
.prow .st .pin{color:var(--rose)}
.ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink-3);display:grid;place-items:center;background:transparent;cursor:pointer;padding:0}
.ck[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ck svg{width:14px;height:14px;stroke-width:3}
.books{border-top:1px solid var(--rule);padding:8px}
.brow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.brow:hover{background:var(--paper)}
.brow.on{font-weight:600}

.sheet{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:min(86vh,720px);display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
@media (max-width:640px){.sheet{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;border-radius:16px 16px 0 0;max-height:88%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--rule)}
.sheet header h2{flex:1;margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.sheet .body{overflow-y:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.menu{display:flex;flex-direction:column;gap:2px;padding:0!important}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 18px;border:0;background:transparent;text-align:left;cursor:pointer;font-size:15px}
.mi:hover{background:var(--paper)}
.mi small{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:14px}
.field .help{font-size:13px;color:var(--ink-3)}
.inp{height:44px;padding:0 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);font:16px var(--ui);width:100%}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{appearance:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3);font-size:13px}
.err{color:var(--err);font-size:14px}
.results{display:flex;flex-direction:column;gap:2px}
.res{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.res:hover{background:var(--paper)}
.res .k{flex:none;font:600 12px var(--ui);color:var(--accent);min-width:54px;font-variant-numeric:tabular-nums}
.res .t{font-family:var(--text-font);font-size:16px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res mark{background:var(--rose-soft);color:inherit;border-radius:3px}
.logrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.logrow:last-child{border-bottom:0}
.logrow .meta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.logrow .chg{font-family:var(--text-font);font-size:17px;line-height:1.6;grid-column:1}
.logrow del{color:var(--err);text-decoration-thickness:2px;background:var(--rose-soft);border-radius:3px;padding:0 2px}
.logrow ins{color:var(--ok);text-decoration:none;background:color-mix(in srgb,var(--ok) 14%,transparent);border-radius:3px;padding:0 2px}
.logrow.undone .chg{opacity:.5}
.logrow .act{grid-column:2;grid-row:1 / span 2;align-self:center}
.kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--paper)}
.helpgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;align-items:baseline}
.sheet h3{margin:4px 0 0;font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.sheet p{margin:0;line-height:1.55;max-width:65ch}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent)}

/* welcome */
.welcome{min-height:0;overflow-y:auto;display:grid;place-items:center;padding-block:32px;padding-inline:16px}
.card{width:min(520px,100%);background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.card h1{margin:0;font-size:24px;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
.card p{margin:0;line-height:1.6;color:var(--ink-2)}
.brandmark{display:flex;align-items:center;gap:12px}
.brandmark .sq{width:42px;height:42px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font:600 24px var(--sans-gu)}
.brandmark .gu{font:600 15px var(--sans-gu);color:var(--rose)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:var(--shadow);font-size:14px;z-index:30;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .tbtn{border:0;background:transparent;color:var(--paper);font-weight:600;text-decoration:underline;cursor:pointer;padding:4px 6px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--rule);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app" class="app">
  <header class="bar">
    <button id="btnMenu" class="ib" aria-label="Pages and books" title="Pages and books"></button>
    <div class="book"><b id="bookName">Melvani</b><span id="syncState" class="sync" data-s="ok">Ready</span></div>
    <nav class="pager" aria-label="Manuscript page">
      <button id="btnPrev" class="ib" aria-label="Previous page" title="Previous page (←)"></button>
      <button id="pageChip" class="pagechip" aria-label="Page list"><span class="pn" id="pageNum">–</span><span class="of" id="pageCount">–</span></button>
      <button id="btnNext" class="ib" aria-label="Next page" title="Next page (→)"></button>
    </nav>
    <div class="actions">
      <button id="btnGoto" class="ib hide-narrow" aria-label="Find verse or text" title="Find verse or text (/)"></button>
      <button id="btnLink" class="ib" aria-label="This page starts at the selected paragraph" title="Page starts here (P)"></button>
      <button id="btnDone" class="btn primary" title="Mark page checked and go to next (D)"><span id="doneIcon"></span><span class="lbl">Page done</span></button>
      <button id="btnMore" class="ib" aria-label="More" title="More"></button>
    </div>

/* ---------- Gujarati transliteration (English letters → Gujarati) ---------- */

  async fetch(word) {

  acceptTop() { if (!this.on || !this.list.length || !this.run) return false; this.replace(this.run, this.list[0]); return true; },
  onInput: debounce(async function (e) {

    } catch { T.fail(); }
  }, 140),
  fail() {
    this.broken = true; this.clear();
    const m = $('#editMsg'); if (m) { m.className = 'edit-msg'; m.textContent = 'The Gujarati typing service could not be reached. Use your device’s Gujarati keyboard instead.'; }
  },
};

/* ---------- books (Google Doc + Drive folder) ---------- */
function parseDocLink(s) {
  s = (s || '').trim();
  const m = s.match(/\/document\/d\/([\w-]{20,})/) || s.match(/^([\w-]{25,})$/);
  const t = s.match(/[?&#]tab=(t\.[\w.-]+)/);
  return m ? { docId: m[1], tabId: t ? t[1] : null } : null;
}
function parseFolderLink(s) {
  s = (s || '').trim();
  const m = s.match(/\/folders\/([\w-]{10,})/) || s.match(/[?&]id=([\w-]{10,})/) || s.match(/^([\w-]{20,})$/);
  return m ? m[1] : null;
}
function bookFormEl(existing, onDone) {
  const docIn = h('input', { class: 'inp', id: 'docLink', type: 'url', placeholder: 'https://docs.google.com/document/d/…', value: existing ? `https://docs.google.com/document/d/${existing.docId}/edit${existing.tabId ? '?tab=' + existing.tabId : ''}` : '' });
  const folIn = h('input', { class: 'inp', id: 'folderLink', type: 'url', placeholder: 'https://drive.google.com/drive/folders/…', value: existing ? `https://drive.google.com/drive/folders/${existing.folderId}` : '' });
  const nameIn = h('input', { class: 'inp', id: 'bookNameIn', type: 'text', placeholder: 'Taken from the Doc title if left empty', value: existing ? existing.name : '' });
  const err = h('div', { class: 'err', role: 'alert' });
  const go = h('button', { class: 'btn primary', type: 'submit' }, existing ? 'Save changes' : 'Open book');
  const form = h('form', { class: 'field', style: 'gap:14px' },
    h('div', { class: 'field' }, h('label', { for: 'docLink' }, 'Google Doc with the typed text'), docIn, h('span', { class: 'help' }, 'Copy the link from the browser’s address bar while the Doc is open.')),
    h('div', { class: 'field' }, h('label', { for: 'folderLink' }, 'Google Drive folder with the scanned pages'), folIn, h('span', { class: 'help' }, 'JPG, PNG or PDF files. Pages are taken in file-name order (10.jpg before 11.jpg).')),
    h('div', { class: 'field' }, h('label', { for: 'bookNameIn' }, 'Name (optional)'), nameIn),
    err, h('div', { class: 'row' }, go));
  form.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    const d = parseDocLink(docIn.value), f = parseFolderLink(folIn.value);
    if (!d) { err.textContent = 'That doesn’t look like a Google Doc link. It should contain /document/d/.'; return; }
    if (!f) { err.textContent = 'That doesn’t look like a Drive folder link. It should contain /folders/.'; return; }
    go.disabled = true; go.textContent = 'Checking…';
    try {
      const j = await api(`${DOCS}/${d.docId}?fields=title`);
      const fo = await api(`${DRIVE}/files/${f}?fields=name,mimeType&supportsAllDrives=true`);
      if (fo.mimeType !== 'application/vnd.google-apps.folder') throw new Error('The second link is a file, not a folder.');
      const name = nameIn.value.trim() || j.title;
      let id;
      if (existing) { Object.assign(Store.data.projects[existing.id], { name, docId: d.docId, tabId: d.tabId, folderId: f, t: now() }); id = existing.id; }
      else { id = uid(); Store.data.projects[id] = { id, name, docId: d.docId, tabId: d.tabId, folderId: f, t: now(), links: {}, done: {}, rot: {}, log: {}, pos: null }; }
      Store.touch();
      onDone(id);
    } catch (ex) {
      if (ex instanceof AuthError) { showReauth(); err.textContent = 'Sign-in expired. Sign in again and retry.'; }
      else err.textContent = (ex.status === 404 ? 'Not found — check the link, and that this Google account can open it. ' : '') + (ex.message || ex);
    } finally { go.disabled = false; go.textContent = existing ? 'Save changes' : 'Open book'; }
  });
  return form;
}
function openBookForm(existing) {

async function openProject(id) {
  if (Edit.active()) Edit.close();
  S.projId = id; S.cur = -1; S.fixed = new Set();
  LS.set('lastProj', id);
  const p = P();
  showWelcome('loading', `Opening ${p.name}…`);
  try { await Promise.all([Doc.load(p), Pages.load(p)]); }
  catch (e) {
    if (e instanceof AuthError) { showWelcome('signin'); return; }
    showWelcome('error', e.message || String(e)); return;
  }
  showWork(true);
  renderText(); updateMarks();
  const r = LS.get(Resume.key(), null);
  let page = 0, top = null, cur = null, draft = null;
  if (r && r.proj === id && (!p.pos || r.t >= p.pos.t)) { page = Math.max(0, Pages.indexOf(r.page)); top = r.top; cur = r.cur; draft = r.draft; }
  else if (p.pos) { page = Math.max(0, Pages.indexOf(p.pos.page)); top = p.pos.para; }
  await goPage(page, { keepText: top != null });
  if (top != null) scrollToPara(clamp(top, 0, Doc.paras.length - 1));
  if (cur != null && cur >= 0 && cur < Doc.paras.length) setCur(cur);
  if (draft) {
    const i = findPara(draft.orig, draft.i);
    if (i >= 0 && draft.value !== draft.orig.replace(/\u000b/g, '\n')) { Edit.start(i, draft.sel, draft.value); banner('info', 'Your unsaved fix is back. Check it and press Save.'); }
  }
  if (DEMO) banner('demo', 'Demo with your notebook pages 10–11 and a few paragraphs of the Doc. Try it: find (બ્રહ્મદારણ્યક), tap it twice, and fix it to (બૃહદારણ્યક). Nothing is sent to Google.');
}

/* ---------- preferences ---------- */
function applyPrefs() {
  const r = document.documentElement.style;
  r.setProperty('--fs', LS.get('fs', 20) + 'px');
  r.setProperty('--text-font', LS.get('font', 'sans') === 'serif' ? 'var(--serif-gu)' : 'var(--sans-gu)');
  r.setProperty('--split-x', LS.get('splitX', 50) + '%');
  r.setProperty('--split-y', LS.get('splitY', 42) + '%');
  $('#split').classList.toggle('swap', !!LS.get('swap', false));
}
const sideBySide = () => matchMedia('(orientation: landscape) and (min-width: 720px)').matches;

/* ---------- wiring ---------- */
function wire() {
  const set = (id, ic) => { $(id).innerHTML = icon(ic); };
  set('#btnMenu', 'menu'); set('#btnPrev', 'left'); set('#btnNext', 'right'); set('#btnGoto', 'search');
  set('#btnLink', 'pin'); set('#btnMore', 'more'); set('#zOut', 'zout'); set('#zFit', 'fit'); set('#zIn', 'zin');
  set('#btnRuler', 'ruler'); set('#btnRotate', 'rotate'); $('#doneIcon').innerHTML = icon('check');
  $('#btnMenu').onclick = openDrawer;
  $('#pageChip').onclick = openDrawer;
  $('#btnPrev').onclick = () => goPage(Pages.idx - 1);
  $('#btnNext').onclick = () => goPage(Pages.idx + 1);
  $('#btnGoto').onclick = openGoto;
  $('#btnLink').onclick = linkHere;
  $('#btnDone').onclick = doneNext;
  $('#btnMore').onclick = openMenu;
  $('#zIn').onclick = () => View.zoomCenter(1.25);
  $('#zOut').onclick = () => View.zoomCenter(0.8);
  $('#zFit').onclick = () => View.fit();
  $('#btnRuler').onclick = () => Ruler.toggle();
  $('#btnRotate').onclick = () => { const pg = Pages.cur(); if (!pg) return; P().rot[pg.key] = { v: (rotOf(pg.key) + 90) % 360, t: now() }; Store.touch(); showScan(pg); };
  $('#scrim').onclick = () => { closeSheet(); closeDrawer(); };

  const text = textEl();
  text.addEventListener('click', e => {
    if (e.target.closest('.editbox')) return;
    const el = e.target.closest('p[data-i]'); if (!el) return;
    const i = Number(el.dataset.i);
    if (S.cur === i && !Edit.active()) Edit.start(i, offsetFromPoint(el, e.clientX, e.clientY));
    else if (S.cur === i && Edit.active() && Edit.i !== i) Edit.start(i, offsetFromPoint(el, e.clientX, e.clientY));
    else setCur(i);
  });

  const pane = $('#textPane');
  let raf = 0;
  pane.addEventListener('scroll', () => {
    Resume.saveSoon();
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const k = pageForPara(topVisibleIdx());
      const f = $('#follow');
      if (k != null && k !== Pages.idx) {
        const pg = Pages.list[k];
        f.replaceChildren(h('span', {}, `The text here is page ${pg.label}`), h('button', { class: 'btn small primary', onclick: () => goPage(k, { keepText: true }) }, 'Show it'));
        f.hidden = false;
      } else f.hidden = true;
    });
  }, { passive: true });

  const div = $('#divider');
  div.addEventListener('pointerdown', e => {
    e.preventDefault(); div.setPointerCapture(e.pointerId);
    const rect = $('#split').getBoundingClientRect(), side = sideBySide(), swap = !!LS.get('swap', false);
    const mv = ev => {
      let pct = side ? (ev.clientX - rect.left) / rect.width * 100 : (ev.clientY - rect.top) / rect.height * 100;
      pct = clamp(pct, 18, 82);
      LS.set(side ? 'splitX' : 'splitY', Math.round(pct)); applyPrefs();
    };
    const up = () => { div.removeEventListener('pointermove', mv); div.removeEventListener('pointerup', up); div.removeEventListener('pointercancel', up); };
    div.addEventListener('pointermove', mv); div.addEventListener('pointerup', up); div.addEventListener('pointercancel', up);
  });
  div.addEventListener('keydown', e => {
    const side = sideBySide(), k = side ? 'splitX' : 'splitY';
    if (['ArrowLeft', 'ArrowUp'].includes(e.key)) { LS.set(k, clamp(LS.get(k, side ? 50 : 42) - 3, 18, 82)); applyPrefs(); e.preventDefault(); }
    if (['ArrowRight', 'ArrowDown'].includes(e.key)) { LS.set(k, clamp(LS.get(k, side ? 50 : 42) + 3, 18, 82)); applyPrefs(); e.preventDefault(); }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#sheet').hidden) { closeSheet(); return; } if (!$('#drawer').hidden) { closeDrawer(); return; } }
    const tg = e.target;
    if (tg.closest && tg.closest('input,textarea,select,[contenteditable]')) return;
    if (tg.closest && tg.closest('button,a,[role=button],[role=checkbox]') && (e.key === 'Enter' || e.key === ' ')) return;
    if (!$('#sheet').hidden || !$('#drawer').hidden || $('#split').hidden) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowRight') { goPage(Pages.idx + 1); e.preventDefault(); }
    else if (k === 'ArrowLeft') { goPage(Pages.idx - 1); e.preventDefault(); }
    else if (k === 'ArrowDown') { Ruler.step(1); e.preventDefault(); }
    else if (k === 'ArrowUp') { Ruler.step(-1); e.preventDefault(); }
    else if (k === 'e' || k === 'Enter') { if (S.cur >= 0) { Edit.start(S.cur); e.preventDefault(); } }
    else if (k === 'd') doneNext();
    else if (k === 'p') linkHere();
    else if (k === '/') { openGoto(); e.preventDefault(); }
    else if (k === 'r') Ruler.toggle();
    else if (k === '+' || k === '=') View.zoomCenter(1.25);
    else if (k === '-') View.zoomCenter(0.8);
    else if (k === '0') View.fit();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') Store.pull();
    else { Resume.save(); if (!DEMO && Auth.valid()) Store.flush(); }
  });
  addEventListener('pagehide', () => Resume.save());
}

async function boot() {
  applyPrefs(); wire(); View.init(); Ruler.init();
  if (DEMO) {
    await Store.load();
    S.projId = 'demo';
    await openProject('demo');
    return;
  }
  Auth.init();
  if (!Auth.valid()) { Store.data = normalize(LS.get('storeCache', null)); showWelcome('signin'); return; }
  showWelcome('loading', 'Loading your books…');
  try {
    await Store.load();
    if (!LS.get('email', '')) api('https://www.googleapis.com/oauth2/v3/userinfo').then(u => u && u.email && LS.set('email', u.email)).catch(() => {});
  } catch (e) {
    if (e instanceof AuthError) { showWelcome('signin'); return; }
    Store.data = normalize(LS.get('storeCache', null));
    toast('Could not reach Google Drive — showing your last saved progress.');
  }
  setSync('ok');
  const books = liveProjects();
  const last = LS.get('lastProj', null);
  const r = LS.get('resume', null);
  const pick = (r && Store.data.projects[r.proj] && !Store.data.projects[r.proj].deleted && r.proj) || (last && Store.data.projects[last] && !Store.data.projects[last].deleted && last) || (books[0] && books[0].id);
  if (!pick) { showWelcome('add'); return; }
  await openProject(pick);
}

if (!CONFIG.ARTIFACT && 'serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
boot().catch(e => { console.error(e); showWelcome('error', e.message || String(e)); });
